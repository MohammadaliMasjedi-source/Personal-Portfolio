# Deploy the static site to GitHub Pages.
# After your first push, go to: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". That's it — every push to main redeploys.
name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Collect only the public site files
        # Internal notes (AGENTS.md, TASKS.md, docs/, handbook/ ...) stay in the
        # repository but are not published on the website.
        run: |
          mkdir _site
          cp -r index.html css js assets projects robots.txt sitemap.xml .nojekyll _site/
          find _site -name '*.py' -delete
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
