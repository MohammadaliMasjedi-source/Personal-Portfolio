<!doctype html>
<html lang="en" dir="ltr" data-sp="sula" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Sula Sweets &#183; Brand Identity Board</title>
<style>
:root{
  --seasalt:#F7FBFB; --coconut:#F3ECDD; --lagoon:#1E9BB8; --deep:#0E3A4A;
  --seaglass:#A8D8C4; --palm:#5DAF7E; --gold:#E4C67A;
  --paper:#FBF9F2; --panel:#FFFFFF; --ink:#0E3A4A; --ink-soft:rgba(14,58,74,.68);
  --ink-faint:rgba(14,58,74,.45); --line:rgba(14,58,74,.16); --gold-ink:#A98936;
  --shadow:0 14px 38px rgba(14,58,74,.10);
  --serif:Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua','Times New Roman',serif;
  --sans:'Avenir Next','Segoe UI',system-ui,Arial,sans-serif;
  --fa:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;
}
html[data-theme="night"]{
  --paper:#0A2833; --panel:#0E3A4A; --ink:#EAF4F2; --ink-soft:rgba(234,244,242,.72);
  --ink-faint:rgba(234,244,242,.45); --line:rgba(234,244,242,.16); --gold-ink:#E4C67A;
  --shadow:0 14px 38px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  line-height:1.6; -webkit-font-smoothing:antialiased; transition:background .4s,color .4s;
}
html[lang="fa"] body{font-family:var(--fa)}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background:
    radial-gradient(1100px 500px at 12% -4%, rgba(168,216,196,.16), transparent 60%),
    radial-gradient(900px 480px at 96% 4%, rgba(228,198,122,.13), transparent 55%),
    radial-gradient(1000px 700px at 50% 108%, rgba(30,155,184,.09), transparent 60%);
}
.wrap{position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:0 clamp(18px,4vw,44px)}

/* toolbar */
.bar{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:14px;
  padding:12px clamp(18px,4vw,44px); backdrop-filter:blur(10px);
  background:color-mix(in srgb, var(--paper) 82%, transparent); border-bottom:1px solid var(--line);
}
.bar .brand-min{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.24em;font-weight:600}
.bar .spacer{flex:1}
.seg{display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--panel)}
.seg button{
  appearance:none;border:0;background:transparent;color:var(--ink-soft);cursor:pointer;
  font:600 11px/1 var(--sans); letter-spacing:.14em; padding:8px 13px; transition:background .25s,color .25s;
}
html[lang="fa"] .seg button{font-family:var(--fa)}
.seg button[aria-pressed="true"]{background:var(--deep);color:#F7FBFB}
html[data-theme="night"] .seg button[aria-pressed="true"]{background:var(--seaglass);color:#0E3A4A}

/* hero */
.hero{display:grid; grid-template-columns:1.1fr .9fr; gap:clamp(28px,5vw,64px); align-items:center; padding:clamp(44px,7vw,96px) 0 clamp(30px,4vw,54px)}
.kicker{font-size:11px; letter-spacing:.32em; text-transform:uppercase; color:var(--gold-ink); font-weight:700}
html[lang="fa"] .kicker{letter-spacing:.08em}
h1{font-family:var(--serif); font-weight:400; font-size:clamp(34px,5vw,58px); line-height:1.12; margin:18px 0 20px}
html[lang="fa"] h1{font-family:var(--fa); font-weight:700}
.intro{max-width:52ch; color:var(--ink-soft); font-size:clamp(15px,1.4vw,17px)}
.sp-note{margin-top:26px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--ink-soft)}
.hero-art{filter:drop-shadow(0 22px 40px rgba(14,58,74,.16))}
.hero-art svg{width:100%;height:auto;display:block;border-radius:16px}

/* sections */
section{padding:clamp(34px,5vw,64px) 0}
.sec-head{max-width:66ch; margin-bottom:clamp(22px,3vw,36px)}
h2{font-family:var(--serif); font-weight:400; font-size:clamp(24px,3vw,34px); margin:10px 0 12px}
html[lang="fa"] h2{font-family:var(--fa); font-weight:700}
.sec-head p{color:var(--ink-soft)}
.wave-rule{display:block;width:min(280px,60%);height:22px;color:var(--seaglass);margin:0 0 4px}

/* cards & grids */
.grid{display:grid;gap:clamp(16px,2.4vw,26px)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:16px;
  box-shadow:var(--shadow); overflow:hidden;
}
.card .art{padding:clamp(14px,2vw,22px)}
.card .art svg{width:100%;height:auto;display:block;border-radius:10px}
.card figcaption{padding:12px 18px 16px; font-size:12.5px; color:var(--ink-soft); border-top:1px solid var(--line)}
.lockups{grid-template-columns:repeat(2,1fr)}
.lockups .card.wide{grid-column:1/-1}
.lockups .card.wide .art{display:grid;grid-template-columns:1fr;gap:14px}

/* palette */
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:14px}
.chip{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow)}
.chip-fill{height:96px;display:flex;align-items:flex-end;padding:10px}
.chip-hex{font:600 11px/1 var(--sans);letter-spacing:.08em;opacity:.9}
.chip-meta{padding:10px 12px;font-size:12px;display:flex;flex-direction:column;gap:2px}
.chip-meta strong{font-size:12.5px}
.chip-meta span{color:var(--ink-soft)}

/* type */
.type-rows{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.type-row{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:baseline;padding:clamp(16px,2.4vw,26px);border-top:1px solid var(--line)}
.type-row:first-child{border-top:0}
.type-label{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-ink);font-weight:700}
html[lang="fa"] .type-label{letter-spacing:.06em}
.spec-serif{font-family:var(--serif);font-size:clamp(24px,3.4vw,40px);line-height:1.2}
.spec-sans{font-size:clamp(14px,1.5vw,17px);color:var(--ink-soft)}
.spec-fa{font-family:var(--fa);font-size:clamp(20px,2.6vw,30px);direction:rtl}
.type-note{font-size:12px;color:var(--ink-faint);margin-top:12px}

/* flavor */
.flavors{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.flavor{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 18px;box-shadow:var(--shadow)}
.flavor-dot{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(14,58,74,.12)}
.flavor-name{font-weight:600;font-size:14px}
.flavor-hex{margin-inline-start:auto;font-size:11px;color:var(--ink-faint);letter-spacing:.06em}

/* rules */
.rules{grid-template-columns:repeat(3,1fr)}
.rule{position:relative}
.rule .badge{
  position:absolute;top:10px;inset-inline-start:10px;z-index:2;font:700 10px/1 var(--sans);
  letter-spacing:.18em;padding:6px 10px;border-radius:999px;color:#fff;background:var(--palm);
}
html[lang="fa"] .rule .badge{font-family:var(--fa);letter-spacing:0;font-size:11px}
.rule.no .badge{background:var(--deep)}
html[data-theme="night"] .rule.no .badge{background:#062028;border:1px solid var(--line)}
.rule figcaption{min-height:64px}

/* open items */
.open-list{display:flex;flex-direction:column;gap:12px;max-width:74ch}
.open-item{display:flex;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;box-shadow:var(--shadow);font-size:14px;color:var(--ink-soft)}
.open-item .q{flex:none;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#0E3A4A;display:flex;align-items:center;justify-content:center;font:700 14px/1 var(--serif)}

footer{padding:40px 0 64px;border-top:1px solid var(--line);margin-top:30px;font-size:12.5px;color:var(--ink-faint);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
footer .sprig-foot{width:34px;height:30px}

/* spelling toggle visibility */
.v{display:none}
html[data-sp="sula"] .v-sula{display:contents}
html[data-sp="sola"] .v-sola{display:contents}

/* reveal animation */
.reveal{opacity:1;transform:none}
@media (prefers-reduced-motion:no-preference){
  .reveal{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s ease}
  .reveal.in{opacity:1;transform:none}
  .hero-art{animation:heroIn 1s ease both}
  @keyframes heroIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
}

@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .g3,.rules{grid-template-columns:1fr 1fr}
  .type-row{grid-template-columns:1fr}
}
@media (max-width:600px){
  .g3,.g2,.rules,.lockups{grid-template-columns:1fr}
  .bar{flex-wrap:wrap}
}
@media print{
  .bar{display:none}
  body::before{display:none}
  .card,.chip,.flavor,.open-item{box-shadow:none}
}
</style>
</head>
